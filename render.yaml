services:
  # 1. Backend Web Service (Node.js + Express + MongoDB + Cloudinary)
  - type: web
    name: vtest-backend
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # 2. Frontend Static Site (React 19 + Vite + Tailwind CSS)
  - type: web
    name: vtest-website
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: vtest-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
          suffix: /api
      - key: VITE_BACKEND_URL
        fromService:
          name: vtest-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
