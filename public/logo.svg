<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 52" fill="none">
  <defs>
    <linearGradient id="vt_check_grad" x1="6" y1="24" x2="44" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#2ECC71" />
    </linearGradient>
    <filter id="vt_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#10B981" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Green checkmark icon ('V') -->
  <g filter="url(#vt_glow)">
    <path
      d="M 8 26 L 22 42 L 44 10"
      stroke="url(#vt_check_grad)"
      stroke-width="9"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- 'etest' Wordmark — White for dark mode, baseline aligned with V fold -->
  <text
    x="41"
    y="42"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="35"
    letter-spacing="-0.04em"
    fill="#FFFFFF"
  >etest</text>
</svg>
